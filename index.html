<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1f2e" />
    <title>Emberwick Vale</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #1a1f2e; overflow: hidden; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; width: 100%; height: 100%; outline: none; }
      #hint {
        position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
        width: max-content; max-width: calc(100vw - 32px);
        font: 500 13px/1.4 Georgia, 'Times New Roman', serif;
        color: #f4ead6; text-shadow: 0 1px 3px rgba(20, 14, 10, 0.85);
        opacity: 0; transition: opacity 1.4s ease; pointer-events: none; user-select: none;
      }
      #hint.visible { opacity: 0.92; }
      #hint kbd {
        font: 600 11px/1 Georgia, serif; padding: 3px 6px; margin-right: 3px;
        border: 1px solid rgba(244, 234, 214, 0.55); border-radius: 3px;
        background: rgba(30, 22, 16, 0.35);
      }
      #diagnostics {
        position: fixed; top: 10px; left: 10px; padding: 8px 10px; min-width: 196px;
        font: 11px/1.45 ui-monospace, Consolas, monospace; white-space: pre;
        color: #d9f2d0; background: rgba(8, 12, 10, 0.72); border-radius: 4px;
        pointer-events: none;
      }
      #hud { position: fixed; inset: 0; pointer-events: none; user-select: none;
        font: 500 14px/1.35 Georgia, 'Times New Roman', serif; color: #f4ead6;
        text-shadow: 0 1px 3px rgba(20, 14, 10, 0.85); }
      .hud-status {
        position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
        display: flex; align-items: center; gap: 12px; padding: 6px 13px;
        background: rgba(30, 22, 16, 0.5); border: 1px solid rgba(244, 234, 214, 0.2); border-radius: 18px;
      }
      .hud-stat { display: inline-flex; align-items: center; gap: 5px; min-width: 38px; }
      .hud-stat[data-stat="wood"] { min-width: 62px; }
      .hud-stat svg { width: 17px; height: 17px; flex: none; }
      .hud-stat b { font-weight: 700; font-variant-numeric: tabular-nums; }
      .hud-stat.pulse b { animation: hud-pulse 0.75s ease-out; }
      .hud-day { padding-left: 12px; border-left: 1px solid rgba(244, 234, 214, 0.28); white-space: nowrap; }
      @keyframes hud-pulse {
        0% { color: #ffd98a; transform: scale(1.22); }
        100% { color: inherit; transform: scale(1); }
      }
      .hud-stat b { display: inline-block; transform-origin: left center; }
      .hud-action {
        position: absolute; left: 50%; bottom: max(62px, calc(env(safe-area-inset-bottom) + 48px));
        transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
        display: flex; flex-direction: column; align-items: center; gap: 7px; text-align: center;
      }
      .hud-feedback, .hud-prompt { opacity: 0; transition: opacity 0.18s ease; padding: 5px 13px; border-radius: 15px; background: rgba(30, 22, 16, 0.6); }
      .hud-feedback { font-style: italic; }
      .hud-prompt.visible, .hud-feedback.visible { opacity: 1; }
      .hud-prompt.blocked { color: #d9c9b0; }
      .hud-prompt.blocked kbd { background: #8d7f6c; }
      .hud-notice {
        position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%);
        max-width: min(520px, calc(100vw - 32px)); padding: 5px 13px; border-radius: 15px; text-align: center;
        background: rgba(30, 22, 16, 0.6); opacity: 0; transition: opacity 0.3s ease;
      }
      .hud-notice.visible { opacity: 1; }
      @media (max-width: 900px) { .hud-notice { top: 104px; } }
      .hud-prompt kbd {
        font: 700 11px/1 Georgia, serif; padding: 3px 6px; margin-right: 7px;
        color: #2a1e12; background: #f0d9a4; border-radius: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .hud-stat.pulse b { animation: none; }
        .hud-feedback, .hud-prompt { transition: none; }
      }
      .hud-save {
        position: absolute; top: calc(max(14px, env(safe-area-inset-top)) + 40px); right: max(16px, env(safe-area-inset-right));
        display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap;
        max-width: calc(100vw - 32px);
      }
      .hud-save-status {
        padding: 3px 10px; border-radius: 12px; background: rgba(30, 22, 16, 0.6); font-size: 13px; font-style: italic;
        opacity: 0; transition: opacity 0.3s ease;
      }
      .hud-save-status.visible { opacity: 1; }
      .hud-save-status.error { color: #ffd2b0; background: rgba(110, 34, 20, 0.86); font-style: normal; }
      .save-button {
        pointer-events: auto; cursor: pointer; font: 600 15px/1.2 Georgia, 'Times New Roman', serif; color: #f4ead6;
        padding: 9px 20px; min-height: 40px; border-radius: 20px; border: 1px solid rgba(244, 234, 214, 0.32);
        background: rgba(30, 22, 16, 0.62); text-shadow: 0 1px 2px rgba(20, 14, 10, 0.8);
        transition: background 0.12s ease, border-color 0.12s ease;
      }
      .save-button:hover { background: rgba(70, 50, 32, 0.8); border-color: rgba(244, 234, 214, 0.55); }
      .save-button:active { background: rgba(20, 14, 10, 0.85); }
      .save-button:focus-visible { outline: 2px solid #f0d9a4; outline-offset: 2px; }
      .save-button.primary { color: #2a1e12; background: #f0d9a4; border-color: #f0d9a4; text-shadow: none; }
      .save-button.primary:hover { background: #f8e6ba; }
      .save-button.danger { background: rgba(120, 42, 26, 0.9); border-color: rgba(255, 190, 150, 0.5); }
      .save-button.danger:hover { background: rgba(150, 54, 32, 0.95); }
      .save-button.small { font-size: 12.5px; font-weight: 500; padding: 4px 11px; min-height: 26px; border-radius: 13px; background: rgba(30, 22, 16, 0.5); }
      .save-button.small:hover { background: rgba(70, 50, 32, 0.8); }
      @media (pointer: coarse) { .save-button.small { min-height: 44px; padding: 8px 16px; border-radius: 22px; } }
      .save-backdrop, #start-screen {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 10;
        font: 500 15px/1.45 Georgia, 'Times New Roman', serif; color: #f4ead6; text-align: center;
      }
      .save-backdrop { background: rgba(14, 10, 8, 0.55); z-index: 20; }
      #start-screen { background: radial-gradient(ellipse at 50% 38%, #3a2c20 0%, #1a1f2e 72%); }
      .save-dialog, .start-panel { width: min(440px, 100%); box-sizing: border-box; }
      .save-dialog { padding: 22px 24px; background: rgba(36, 26, 18, 0.96); border: 1px solid rgba(244, 234, 214, 0.28); border-radius: 14px; }
      .save-dialog h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; }
      .save-dialog p { margin: 0 0 18px; color: #e6d9c0; overflow-wrap: anywhere; }
      .save-actions, .start-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      .start-panel h1 { margin: 0 0 18px; font-size: clamp(34px, 8vw, 54px); font-weight: 500; letter-spacing: 0.01em; color: #f0d9a4; text-shadow: 0 2px 10px rgba(255, 150, 70, 0.28); }
      .start-summary { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
      .start-when { margin: 2px 0 0; font-size: 13.5px; font-style: italic; color: #cdbfa6; }
      .start-warning { margin: 14px 0 0; padding: 8px 12px; border-radius: 10px; color: #ffd2b0; background: rgba(110, 34, 20, 0.6); font-size: 14px; }
      .start-actions { margin-top: 24px; }
      @media (prefers-reduced-motion: reduce) { .hud-save-status, .save-button { transition: none; } }
      #fatal {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
        font: 16px/1.5 Georgia, serif; color: #f4ead6; text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hint" aria-hidden="true">
      <span><kbd>A</kbd><kbd>D</kbd>walk</span>
      <span><kbd>W</kbd><kbd>S</kbd>depth</span>
      <span><kbd>Shift</kbd>sprint</span>
      <span><kbd>E</kbd>interact</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
